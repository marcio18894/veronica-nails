<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width">
<title>Veronica Nails</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#fff0f5;padding:20px}
.container{max-width:420px;margin:0 auto;background:white;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.1);overflow:hidden}
.header{background:linear-gradient(135deg,#ff5a9e,#ff8fab);color:white;padding:28px;text-align:center}
.header h1{font-size:28px;font-weight:800}
.form{padding:24px;display:flex;flex-direction:column;gap:16px}
input,select{width:100%;padding:14px;border-radius:12px;border:1.5px solid #ffd1dc}
button{background:#ff5a9e;color:white;border:none;padding:16px;border-radius:12px;font-weight:700;cursor:pointer}
.card{background:#fff7f9;border:1px solid #ffd1dc;padding:14px;border-radius:12px;margin-top:12px;display:flex;justify-content:space-between}
</style></head>
<body>
<div class="container">
<div class="header"><h1>💅 Veronica Nails</h1><p>Agendamento rápido</p></div>
<div class="form">
<input id="nome" placeholder="Nome da cliente">
<select id="servico"><option>Alongamento em Gel</option><option>Manicure Russa</option><option>Esmaltação em Gel</option><option>Manutenção</option></select>
<div style="display:flex;gap:10px"><input id="data" type="date" style="flex:1"><input id="hora" type="time" style="flex:1"></div>
<button onclick="agendar()">Agendar Horário</button>
</div>
<div id="lista" style="padding:0 24px 24px"></div>
</div>
<script>
function load(){let d=JSON.parse(localStorage.getItem('vn')||'[]');document.getElementById('lista').innerHTML=d.length?d.map((a,i)=>`<div class=card><div><b>${a.nome}</b><br>${a.servico} - ${a.data} ${a.hora}</div><span onclick="let x=JSON.parse(localStorage.getItem('vn')||'[]');x.splice(${i},1);localStorage.setItem('vn',JSON.stringify(x));location.reload()" style="cursor:pointer">🗑️</span></div>`).join(''):'<p style=text-align:center;color:#999>Nenhum agendamento</p>'}
function agendar(){let n=document.getElementById('nome').value,d=document.getElementById('data').value,h=document.getElementById('hora').value,s=document.getElementById('servico').value;if(!n||!d||!h)return alert('Preencha tudo');let a=JSON.parse(localStorage.getItem('vn')||'[]');a.push({nome:n,servico:s,data:d.split('-').reverse().join('/'),hora:h});localStorage.setItem('vn',JSON.stringify(a));location.reload()}
load();document.getElementById('data').valueAsDate=new Date();
</script>
</body>
</html>
